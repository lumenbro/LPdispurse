name = "lmnr-federation"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Deliberately NOT behind Cloudflare Access: a SEP-2 federation server must be
# publicly queryable by any wallet. It is a separate Worker from lmnr-rewards
# (which IS gated) and holds no secrets -- it only maps names to public
# addresses, all of which are already public on-chain.
preview_urls = false

[observability]
enabled = true

[vars]
FEDERATION_DOMAIN = "thelumenaire.com"
