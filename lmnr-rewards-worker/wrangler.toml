name = "lmnr-rewards"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# Required for @stellar/stellar-sdk. Proven working across several Workers in
# this account (MAHORAGA/sdex-mm, LumenBroMobile/x-tip-bot).
compatibility_flags = ["nodejs_compat"]

# Hourly. Change to "0 0 * * *" for daily.
[triggers]
crons = ["0 * * * *"]

# Idempotency ledger. Without this a crashed/retried run can DOUBLE-PAY.
#   wrangler kv namespace create LEDGER
[[kv_namespaces]]
binding = "LEDGER"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true

[vars]
HORIZON_URL = "https://horizon.stellar.org"
NETWORK = "public"
REWARD_ASSET_CODE = "xLMNR"
REWARD_ASSET_ISSUER = "GDKA6WVMFSA73BMEVKPO6WXSSWP4MPRBDJVSXLLSEVIEVH226L5RJ7NL"
# Daily reward budget PER POOL, in whole tokens. Emission is this / 24 per hour.
DAILY_REWARD_PER_POOL = "4000"
# Skip payouts below this (whole tokens) so dust doesn't waste an operation.
MIN_PAYOUT = "0.001"
# SAFETY: starts as a dry run. Set to "false" only when you have verified a run.
DRY_RUN = "true"
# Comma-separated liquidity pool IDs.
# Verified live pool IDs (holders as of 2026-08-28):
#   8b090132.. native/xLMNR  8 holders
#   d4332ed0.. JDMC/xLMNR    8 holders
#   1810a533.. SHX/xLMNR     6 holders
# Others with holders: 56828967.. ACT/xLMNR (6), 0711acd7.. TDT/xLMNR (5),
#   cff77c99.. SCOP/xLMNR (5). The xLMNR/VELO pool has only 1 holder.
POOL_IDS = "8b0901329b099a6588996fb8b560fc96d7f79fd44c0610e6796f7d224ef3b8ac,d4332ed0a7f6a9b8a2ebfc66ebcb9cc93e6fb39ccc1030d184146d6de652da6b,1810a5338d75c5bd1727ff476c182640cd98631b023703f82fbf0fa424b0ee54"

# Secret (NEVER in this file):
#   wrangler secret put DISBURSER_SECRET
