name = "lmnr-rewards"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# Required for @stellar/stellar-sdk. Proven working across several Workers in
# this account (MAHORAGA/sdex-mm, LumenBroMobile/x-tip-bot).
compatibility_flags = ["nodejs_compat"]

# Preview URLs are a SECOND publicly-routable host for this Worker. The admin
# page sets spending, so don't leave an extra door open -- Cloudflare Access
# scoped to the Worker covers both, but disabling previews removes the surface.
preview_urls = false

# MUST stay hourly. Payout frequency is now a PER-POOL setting evaluated on
# every tick; a slower cron does not make pools pay less often, it starves the
# hourly ones into paying 1/24 of their daily budget once a day.
[triggers]
crons = ["0 * * * *"]

# Serialization authority for payouts. Workers KV is eventually consistent with
# no compare-and-set, so it cannot stop an hourly cron tick and a manual /run
# from both reading "not paid yet" and both paying. A Durable Object is
# single-threaded per object, which turns that race into two ordered calls.
#
# Cost, on the Workers Paid plan (1M DO requests + 400,000 GB-s included/month):
# the object holds ONLY the lock and the state -- Horizon paging and transaction
# submission stay in the Worker -- so each call is milliseconds, not the ~30s a
# payout takes. Measured on the first live run: 3 calls per payment (begin, a
# pending commit before submitting, then the final commit), with the ~8 seconds
# of Horizon and submission work sitting BETWEEN them, outside the object. Three
# pools paying hourly is ~6,500 requests and well under 100 GB-s a month -- under
# 1% of the included allowance. Do not move slow work inside the object;
# duration is billed on wall time and doing so would raise it by orders of
# magnitude. A multi-batch payout costs batches + 2 calls.
[[durable_objects.bindings]]
name = "PAYOUT_LOCK"
class_name = "PayoutLock"

# SQLite-backed: the current default, available on both plans, and billed per
# row rather than per 4 KB unit. State here is a handful of small keys per
# reward instance against a 5 GB-month allowance.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PayoutLock"]

# Idempotency ledger, now the AUDIT TRAIL rather than the authority. If it ever
# disagrees with the Durable Object, the Durable Object is right.
#   wrangler kv namespace create LEDGER
[[kv_namespaces]]
binding = "LEDGER"
id = "2a5c9e6c23284f4ea8c1124d5544e91f"

[observability]
enabled = true

[vars]
HORIZON_URL = "https://horizon.stellar.org"
NETWORK = "public"
REWARD_ASSET_CODE = "xLMNR"
REWARD_ASSET_ISSUER = "GDKA6WVMFSA73BMEVKPO6WXSSWP4MPRBDJVSXLLSEVIEVH226L5RJ7NL"
# Seed values only: used until someone saves config on the admin page, after
# which per-pool settings in KV (config:instances) take over entirely.
DAILY_REWARD_PER_POOL = "4000"
# Skip payouts below this (whole tokens) so dust doesn't waste an operation.
MIN_PAYOUT = "0.001"
# SAFETY: starts as a dry run. Set to "false" only when you have verified a run.
DRY_RUN = "false"
# Emails allowed through Cloudflare Access (comma separated).
ADMIN_EMAILS = "bpeterscqa@gmail.com,lmnr013@gmail.com"
